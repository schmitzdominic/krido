<ng-template #addOrEditEntryModal let-modal>
  <app-add-or-edit-entry
    [entry]="selectedEntry"
    (onClose)="onCloseAddOrEditEntryModal()">
  </app-add-or-edit-entry>
</ng-template>

<div class="history-list">
  @if (entries().length > 0) {
    @if (title()) {
      <h2 class="section-label">{{ title() }}</h2>
    }
    <div class="total-amount" [class.total-amount--positive]="totalAmount() >= 0" [class.total-amount--negative]="totalAmount() < 0">
      <span class="total-amount__label">Gesamt</span>
      <span class="total-amount__value">{{ totalAmount() >= 0 ? '' : '- ' }}{{ priceService.convertNumberToEuro(Math.abs(totalAmount())) }}</span>
    </div>
    <div class="entries-card-group">
      @for (entry of entries(); track entry.id) {
        <div class="entry-row" (click)="onEntryClick(entry)">
          <app-entry-list-entry
            [withMonth]="true"
            [entry]="entry">
          </app-entry-list-entry>
        </div>
      }
    </div>
  }
  @if (entries().length === 0) {
    <p class="empty-hint">Suche nach Einträgen oder wähle einen Monat.</p>
  }
</div>
