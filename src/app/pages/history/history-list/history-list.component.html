<ng-template #addOrEditEntryModal let-modal>
  <app-add-or-edit-entry
    [entry]="selectedEntry"
    (onClose)="onCloseAddOrEditEntryModal()">
  </app-add-or-edit-entry>
</ng-template>

<div class="history-list">
  @if (entries().length > 0) {
    @if (title()) {
      <h2 class="section-label">{{ title() }}</h2>
    }
    <div class="entries-card-group">
      @for (entry of entries(); track entry.id) {
        <div class="entry-row" (click)="onEntryClick(entry)">
          <app-entry-list-entry
            [withMonth]="historySearchObject()?.isLastMonth ?? false"
            [entry]="entry">
          </app-entry-list-entry>
        </div>
      }
    </div>
  }
  @if (entries().length === 0) {
    <p class="empty-hint">Suche nach Einträgen oder wähle "Letzter Monat".</p>
  }
</div>
