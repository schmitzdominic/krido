<form class="needs-validation" [formGroup]="searchFormGroup" novalidate>
  <div class="col-md-12 mb-3">
    <div class="input-group has-validation">
      <input formControlName="search" type="text" placeholder="Suche" class="form-control" id="invoice-input-search" aria-describedby="inputGroupPrepend" required>
      <span class="input-group-text" id="inputGroupPrepend"><i class="bi bi-search"></i></span>
      <div class="invalid-feedback">
      </div>
    </div>
  </div>
  <div class="col-md-12 mb-3">
    <select class="form-select" id="user" aria-label="Select user" formControlName="accounts">
      <option value="">Alle Konten</option>
      @for (account of accounts; track account.id) {
        <option value="{{ account.id }}">{{ account.name }}</option>
      }
    </select>
  </div>
</form>
@if (!historySearchObject.isLastMonth) {
  <div class="row">
    <div class="col-2">
      <span class="badge bg-light-subtle" style="font-size: 16px; cursor: pointer;" (click)="onClickLastMonth()">Letzter Monat</span>
    </div>
  </div>
}
<app-history-list
  [historySearchObject]="historySearchObject">
</app-history-list>
