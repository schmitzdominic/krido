<div class="history-page">
  <form [formGroup]="searchFormGroup" novalidate>
    <div class="form-field mb-3">
      <div class="search-wrap">
        <i class="bi bi-search search-wrap__icon"></i>
        <input formControlName="search" type="text" placeholder="Suche..."
          class="form-field__input search-wrap__input"
          id="history-search" autocomplete="off">
      </div>
    </div>
    <div class="form-field mb-3">
      <select class="form-field__select-native" formControlName="accounts"
        id="history-accounts" aria-label="Konto auswählen">
        <option value="">Alle Konten</option>
        @for (account of accounts; track account.id) {
          <option value="{{ account.id }}">{{ account.name }}</option>
        }
      </select>
    </div>
  </form>

  <button type="button"
    class="chip-btn mb-3"
    [class.chip-btn--active]="historySearchObject.isLastMonth"
    (click)="onClickLastMonth()">
    <i class="bi bi-clock-history"></i>Letzter Monat
  </button>

  <app-history-list [historySearchObject]="historySearchObject"></app-history-list>
</div>
