<div class="history-page">
  <form [formGroup]="searchFormGroup" novalidate>
    <div class="form-field mb-3">
      <div class="search-wrap">
        <i class="bi bi-search search-wrap__icon"></i>
        <input formControlName="search" type="text" placeholder="Suche..."
          class="form-field__input search-wrap__input"
          id="history-search" autocomplete="off">
      </div>
    </div>
    <div class="form-field mb-3">
      <div ngbDropdown container="body" placement="bottom-end">
        <button class="form-field__select" type="button" ngbDropdownToggle>
          {{ selectedAccountName }}
          <i class="bi bi-chevron-down form-field__chevron"></i>
        </button>
        <div ngbDropdownMenu class="sheet-dropdown">
          <button ngbDropdownItem
            (click)="searchFormGroup.controls['accounts'].setValue('')">
            Alle Konten
          </button>
          @for (account of accounts; track account.id) {
            <button ngbDropdownItem
              (click)="searchFormGroup.controls['accounts'].setValue(account.id)">
              {{ account.name }}
            </button>
          }
        </div>
      </div>
    </div>
  </form>

  <div class="form-field mb-3">
    <div ngbDropdown container="body" placement="bottom-start">
      <button class="form-field__select" type="button" ngbDropdownToggle>
        <span>
          @if (historySearchObject.selectedMonth) {
            {{ dateService.getMonthName(historySearchObject.selectedMonth) }} {{ dateService.getYear(historySearchObject.selectedMonth) }}
          } @else {
            Monat wählen…
          }
        </span>
        <i class="bi bi-chevron-down form-field__chevron"></i>
      </button>
      <div ngbDropdownMenu class="sheet-dropdown">
        @for (month of availableMonths; track month) {
          <button ngbDropdownItem
            [class.active]="historySearchObject.selectedMonth === month"
            (click)="onSelectMonth(month)">
            {{ dateService.getMonthName(month) }} {{ dateService.getYear(month) }}
          </button>
        }
      </div>
    </div>
  </div>

  @if (historySearchObject.searchValue.length > 0 || historySearchObject.account || historySearchObject.selectedMonth) {
    <div class="mb-3">
      <button type="button" class="btn btn-outline-secondary w-100" (click)="resetFilters()">
        <i class="bi bi-x-circle me-2"></i>Filter zurücksetzen
      </button>
    </div>
  }

  <app-history-list [historySearchObject]="historySearchObject"></app-history-list>
</div>
