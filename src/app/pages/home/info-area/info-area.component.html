<ng-template #updateAccountValueModal let-modal>
  <app-update-account-value
    [account]="selectedAccount"
    (onClose)="onCloseUpdateAccountValueModal()">
  </app-update-account-value>
</ng-template>
@if (accounts().length > 0) {
  <section class="accounts-section">
    <div class="accounts-section__header">
      <h2 class="section-label">Konten</h2>
      <button type="button" class="btn-icon" (click)="toggleAccountsSection()">
        <i class="bi" [ngClass]="isAccountsExpanded ? 'bi-eye' : 'bi-eye-slash'"></i>
      </button>
    </div>
    @if (isAccountsExpanded) {
      <div class="account-cards">
        @for (account of accounts(); track account.id) {
          <div class="account-card" (click)="onAccountClick(account)">
            <app-info-list-entry [account]="account"></app-info-list-entry>
          </div>
        }
      </div>
    }
  </section>
}
