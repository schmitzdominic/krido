<!-- View Budget -->
<ng-template #viewBudgetModal let-modal>
  <app-view-budget-content
    [budget]="clickedBudget"
    (onClose)="onCloseViewBudgetModal()">
  </app-view-budget-content>
</ng-template>
<div class="container">
  <div class="row">
    <!-- Info area -->
    <app-info-area>
    </app-info-area>
  </div>
  @if (allTimeBudgets.length > 0 || monthlyBudgets.length > 0) {
    <div class="row">
      <!-- No Time Limit -->
      <h1>Budgets</h1>
      <table class="table table-striped">
        <tbody>
          @for (budget of allTimeBudgets; track budget) {
            <div class="card p-1 m-2" (click)="openViewBudgetModal(budget)">
              <div class="card-body">
                <app-budget-list-entry
                  [budget]="budget">
                </app-budget-list-entry>
              </div>
            </div>
          }
          @for (budget of monthlyBudgets; track budget) {
            <div class="card p-1 m-2" (click)="openViewBudgetModal(budget)">
              <div class="card-body">
                <app-budget-list-entry
                  [budget]="budget">
                </app-budget-list-entry>
              </div>
            </div>
          }
        </tbody>
      </table>
    </div>
  }
  <div class="row">
    <!-- Entries -->
    <app-entry-list>
    </app-entry-list>
  </div>
</div>
