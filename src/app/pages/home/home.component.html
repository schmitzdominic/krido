<!-- Edit Entry Modal (opened from budget view) -->
<ng-template #editEntryModal let-modal>
  <app-add-or-edit-entry
    [entry]="selectedEntry"
    (onClose)="onCloseEditEntryModal()">
  </app-add-or-edit-entry>
</ng-template>

<!-- View Budget -->
<ng-template #viewBudgetModal let-modal>
  <app-view-budget-content
    [budget]="clickedBudget"
    (onClose)="onCloseViewBudgetModal()"
    (onEditEntry)="onEditEntryFromBudget($event)">
  </app-view-budget-content>
</ng-template>
<div class="home-page">
  <!-- Info area -->
  @if (menuTitleService.isAccountsVisible()) {
    <app-info-area></app-info-area>
  }

  @if (allBudgets() === undefined) {
    <section class="home-section">
      <div class="skeleton skeleton--section-label mb-3"></div>
      <div class="budget-cards">
        @for (i of [1, 2]; track i) {
          <div class="budget-card">
            <div class="skeleton-budget-row">
              <div class="skeleton skeleton--budget-name"></div>
              <div class="skeleton skeleton--budget-limit"></div>
            </div>
            <div class="skeleton skeleton--progressbar"></div>
            <div class="skeleton-budget-row mt-2">
              <div class="skeleton skeleton--budget-sub"></div>
              <div class="skeleton skeleton--budget-sub"></div>
            </div>
          </div>
        }
      </div>
    </section>
  }
  @if ((allBudgets() ?? []).length > 0) {
    <section class="home-section">
      <h2 class="section-label">Budgets</h2>
      <div class="budget-cards">
        @for (budget of allBudgets()!; track budget.id) {
          <div class="budget-card" (click)="openViewBudgetModal(budget)">
            <app-budget-list-entry [budget]="budget" class="w-100"></app-budget-list-entry>
          </div>
        }
      </div>
    </section>
  }

  <!-- Entries -->
  <app-entry-list [searchTerm]="menuTitleService.searchTerm()"></app-entry-list>

</div>
