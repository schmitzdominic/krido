<!-- Edit Entry Modal (opened from budget view) -->
<ng-template #editEntryModal let-modal>
  <app-add-or-edit-entry
    [entry]="selectedEntry"
    (onClose)="onCloseEditEntryModal()">
  </app-add-or-edit-entry>
</ng-template>

<!-- View Budget -->
<ng-template #viewBudgetModal let-modal>
  <app-view-budget-content
    [budget]="clickedBudget"
    (onClose)="onCloseViewBudgetModal()"
    (onEditEntry)="onEditEntryFromBudget($event)">
  </app-view-budget-content>
</ng-template>
<div class="home-page">
  <!-- Info area -->
  @if (homeUIService.isAccountsExpanded()) {
    <app-info-area></app-info-area>
  }

  @if (allBudgets() === undefined) {
    <section class="home-section">
      <h2 class="section-label">Budgets</h2>
      <div class="d-flex justify-content-center py-4">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Lädt...</span>
        </div>
      </div>
    </section>
  }
  @if ((allBudgets() ?? []).length > 0) {
    <section class="home-section">
      <h2 class="section-label">Budgets</h2>
      <div class="budget-cards">
        @for (budget of allBudgets()!; track budget.id) {
          <div class="budget-card" (click)="openViewBudgetModal(budget)">
            <app-budget-list-entry [budget]="budget" class="w-100"></app-budget-list-entry>
          </div>
        }
      </div>
    </section>
  }

  <!-- Entries -->
  <app-entry-list></app-entry-list>

</div>
