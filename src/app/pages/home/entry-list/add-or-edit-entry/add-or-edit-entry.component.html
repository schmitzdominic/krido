<div class="sheet-header" [ngClass]="{
  'sheet-header--income':  selectedEntryType.value === incomeEntryType.value,
  'sheet-header--outcome': selectedEntryType.value === expenditureEntryType.value
}">
  <span class="sheet-header__title">{{ title }}</span>
</div>

<div class="modal-body sheet-body">
  <form [formGroup]="addOrEditEntryFormGroup" (ngSubmit)="onSubmit()" novalidate>

    <!-- Typ-Segmented-Control -->
    <div class="segment-control mb-4">
      @for (entryType of entryTypes; track entryType.label) {
        <button
          type="button"
          class="segment-control__btn"
          [class.segment-control__btn--active]="selectedEntryType.value === entryType.value"
          [class.segment-control__btn--income]="entryType.value === incomeEntryType.value && selectedEntryType.value === entryType.value"
          [class.segment-control__btn--outcome]="entryType.value === expenditureEntryType.value && selectedEntryType.value === entryType.value"
          (click)="selectEntryType(entryType)">{{ entryType.label }}</button>
      }
    </div>

    <!-- Kurzbeschreibung -->
    <div class="form-field mb-3">
      <label class="form-field__label">Kurzbeschreibung</label>
      <input formControlName="name" type="text" class="form-field__input" placeholder="z. B. Einkauf Rewe" autocomplete="off">
    </div>

    <!-- Betrag -->
    <div class="form-field mb-3">
      <label class="form-field__label">Betrag</label>
      <div class="form-field__amount-wrap">
        <input
          currencyMask
          class="form-field__input form-field__input--amount"
          formControlName="value"
          [options]="{ prefix: '', thousands: '.', decimal: ',' }"
          inputmode="decimal"
          placeholder="0,00">
        <span class="form-field__currency">€</span>
      </div>
    </div>

    <!-- Datum -->
    <div class="form-field mb-3">
      <label class="form-field__label">Datum</label>
      <div class="form-field__date-wrap">
        <input
          class="form-field__input"
          placeholder="{{ selectedDateTimestamp | date: 'dd.MM.yyyy' }}"
          name="date"
          formControlName="date"
          ngbDatepicker
          [showWeekNumbers]="true"
          [startDate]="selectedDate"
          (dateSelect)="onDateSelected($event)"
          #date="ngbDatepicker"
          readonly />
        <button class="form-field__date-btn" (click)="date.toggle()" type="button">
          <i class="bi bi-calendar3"></i>
        </button>
      </div>
    </div>

    <!-- Konto -->
    <div class="form-field mb-3">
      <label class="form-field__label">Konto</label>
      <div ngbDropdown container="body" class="d-block">
        <button type="button" class="form-field__select" ngbDropdownToggle>
          <span>{{ selectedAccount.name || 'Konto wählen' }}</span>
          <i class="bi bi-chevron-down form-field__chevron"></i>
        </button>
        <div ngbDropdownMenu class="sheet-dropdown">
          @for (account of accounts; track account.id) {
            <button type="button" ngbDropdownItem (click)="selectAccount(account)">{{ account.name }}</button>
          }
        </div>
      </div>
    </div>

    <!-- Budget -->
    <div class="form-field mb-1">
      <label class="form-field__label">Budget</label>
      <div ngbDropdown container="body" class="d-block">
        <button type="button" class="form-field__select" ngbDropdownToggle>
          <span>{{ selectedBudget?.name || 'Kein Budget gewählt' }}</span>
          <i class="bi bi-chevron-down form-field__chevron"></i>
        </button>
        <div ngbDropdownMenu class="sheet-dropdown">
          @for (budget of budgets; track budget.id) {
            <button type="button" ngbDropdownItem (click)="selectBudget(budget)">{{ budget.name }}</button>
          }
        </div>
      </div>
    </div>

  </form>
</div>

<div class="sheet-footer">
  @if (entry) {
    <button type="button" class="btn-sheet btn-sheet--danger" (click)="onButtonDelete()">
      <i class="bi bi-trash"></i>
    </button>
  }
  <button type="button" class="btn-sheet btn-sheet--ghost" (click)="onButtonCancel()">Abbrechen</button>
  <button
    type="button"
    class="btn-sheet btn-sheet--primary"
    [disabled]="isNameInvalid || isValueInvalid || !isEdited"
    (click)="onSubmit()">{{ submitButtonText }}</button>
</div>
