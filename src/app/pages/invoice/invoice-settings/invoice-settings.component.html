<div class="invoice-settings">
  <form [formGroup]="invoiceSettingsFormGroup" novalidate>

    @if (invoiceAccounts.length > 0) {
      <div class="form-field mb-4">
        <label class="form-field__label">Abrechnungskonto</label>
        <select class="form-field__select-native" formControlName="invoiceAccounts"
          id="invoice-settings-invoice-accounts" aria-label="Abrechnungskonto auswählen">
          @for (invoiceAccount of invoiceAccounts; track invoiceAccount.id) {
            <option value="{{ invoiceAccount.id }}">{{ invoiceAccount.name }}</option>
          }
        </select>
      </div>
    }

    @if (selectedInvoiceAccountKey) {
      <div class="form-field mb-3">
        <label class="form-field__label">Verrechnungskonten</label>
        @if (beneficiaryAccounts.length > 0) {
          <div class="add-row">
            <select class="form-field__select-native" formControlName="beneficiaryAccounts"
              id="invoice-settings-beneficiary-accounts-select" aria-label="Verrechnungskonto auswählen">
              @for (beneficiaryAccount of beneficiaryAccounts; track beneficiaryAccount.id) {
                <option value="{{ beneficiaryAccount.id }}">{{ beneficiaryAccount.name }}</option>
              }
            </select>
            <button type="button" class="btn-add" (click)="addSelectedBeneficiaryAccount()">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        }
      </div>

      @if (selectedBeneficiaryAccounts.length > 0) {
        <div class="beneficiary-list mb-4">
          @for (account of selectedBeneficiaryAccounts; track account.id) {
            <div class="beneficiary-item">
              <span class="beneficiary-name">{{ account.name }}</span>
              <button type="button" class="btn-remove" (click)="onRemoveBeneficiaryAccountButtonClick(account)">
                <i class="bi bi-dash-lg"></i>
              </button>
            </div>
          }
        </div>
      }
    }

  </form>

  <div class="settings-footer">
    <button type="button" class="btn-sheet btn-sheet--primary" (click)="onSubmit()">Weiter</button>
  </div>
</div>
