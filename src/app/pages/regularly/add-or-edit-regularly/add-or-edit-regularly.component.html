<div class="modal-body sheet-body">
  <div class="sheet-header" [ngClass]="{
    'sheet-header--income':  selectedEntryType.value === incomeEntryType.value,
    'sheet-header--outcome': selectedEntryType.value === expenditureEntryType.value
  }">
    <span class="sheet-header__title">{{ title }}</span>
  </div>

  <form [formGroup]="addOrEditRegularlyFormGroup" novalidate>

    <!-- Typ -->
    <div class="form-field mb-4">
      <label class="form-field__label">Typ</label>
      <select class="form-field__select-native" formControlName="entryType"
        id="add-regularly-entry-type" aria-label="Typ auswählen">
        @for (entryType of entryTypes; track entryType.value) {
          <option value="{{ entryType.value }}">{{ entryType.label }}</option>
        }
      </select>
    </div>

    <!-- Zyklus -->
    <div class="form-field mb-3">
      <label class="form-field__label">Zyklus</label>
      <select class="form-field__select-native" formControlName="cycleType"
        id="add-regularly-cycle-type" aria-label="Zyklus auswählen">
        @for (cycleType of cycleTypes; track cycleType.value) {
          <option value="{{ cycleType.value }}">{{ cycleType.label }}</option>
        }
      </select>
    </div>

    <!-- Kurzbeschreibung -->
    <div class="form-field mb-3">
      <label class="form-field__label">Kurzbeschreibung</label>
      <input formControlName="name" type="text" class="form-field__input"
        placeholder="z. B. Spotify" autocomplete="off">
    </div>

    <!-- Betrag -->
    <div class="form-field mb-3">
      <label class="form-field__label">Betrag</label>
      <div class="form-field__amount-wrap">
        <input currencyMask class="form-field__input form-field__input--amount"
          formControlName="value"
          [options]="{ prefix: '', thousands: '.', decimal: ',' }"
          inputmode="decimal" placeholder="0,00">
        <span class="form-field__currency">€</span>
      </div>
    </div>

    <!-- Konto -->
    <div class="form-field mb-3">
      <label class="form-field__label">Konto</label>
      <select class="form-field__select-native" formControlName="account"
        id="add-regularly-account" aria-label="Konto auswählen">
        @for (account of accounts; track account.id) {
          <option value="{{ account.id }}">{{ account.name }}</option>
        }
      </select>
    </div>

    <!-- Datum (nur bei jährlich) -->
    @if (selectedCycleType === yearCycleType) {
      <div class="form-field mb-3">
        <label class="form-field__label">Datum</label>
        <div class="form-field__date-wrap">
          <input id="add-entry-date" class="form-field__input"
            placeholder="{{ selectedDateTimestamp | date: 'dd.MM'}}"
            name="date" formControlName="date"
            ngbDatepicker container="body"
            [showWeekNumbers]="true"
            (dateSelect)="onDateSelected($event)"
            #date="ngbDatepicker" readonly />
          <button class="form-field__date-btn" (click)="date.toggle()" type="button">
            <i class="bi bi-calendar3"></i>
          </button>
        </div>
      </div>
    }

    <!-- Tag im Monat -->
    @if (!isLastDay && isMonthDayNeeded) {
      <div class="form-field mb-3">
        <label class="form-field__label">Tag im Monat</label>
        <input currencyMask class="form-field__input"
          formControlName="monthDay"
          [max]="28" maxlength="2"
          [options]="{ prefix: '', allowNegative: false, precision: 0 }"
          inputmode="numeric">
      </div>
    }

    <!-- Letzter Tag -->
    @if (isMonthDayNeeded) {
      <div class="toggle-row mb-3">
        <label class="toggle-row__label" for="add-regularly-month-last-day">Letzter Tag im Monat</label>
        <input formControlName="lastDay" class="toggle-row__check" type="checkbox"
          id="add-regularly-month-last-day">
      </div>
    }

  </form>
</div>

<div class="sheet-footer">
  @if (regularly) {
    <button type="button" class="btn-sheet btn-sheet--danger" (click)="onButtonDelete()">
      <i class="bi bi-trash"></i>
    </button>
  }
  <button type="button" class="btn-sheet btn-sheet--ghost" (click)="onButtonCancel()">Abbrechen</button>
  <button type="button" class="btn-sheet btn-sheet--primary"
    [disabled]="isNameInvalid || isValueInvalid || isMonthDayInvalid"
    (click)="onSubmit()">{{ submitButtonText }}</button>
</div>
