<div class="settings-card">
  <h2 class="settings-card__title">
    <i class="bi bi-person me-2"></i>Benutzer
  </h2>
  <div class="settings-list">
    <div class="settings-row">
      <span class="settings-row__label">E-Mail</span>
      <span class="settings-row__value">{{ userService.user.email }}</span>
    </div>
    <div class="settings-row settings-row--select">
      <label class="settings-row__label">Hauptkonto</label>
      <div ngbDropdown container="body" placement="bottom-end" class="w-100">
        <button class="settings-select" type="button" ngbDropdownToggle>
          {{ mainAccount?.name || 'Konto auswählen' }}
          <i class="bi bi-chevron-down settings-chevron"></i>
        </button>
        <div ngbDropdownMenu class="sheet-dropdown">
          @for (account of accounts(); track $index) {
            <button ngbDropdownItem
              (click)="settingsUserFormGroup.controls['mainAccount'].setValue((account)['id'])">
              {{ account.name }}
            </button>
          }
        </div>
      </div>
    </div>
  </div>
</div>

<button type="button" class="logout-btn mt-3" (click)="onButtonLogout()">
  <i class="bi bi-box-arrow-right me-2"></i>Abmelden
</button>
