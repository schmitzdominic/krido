<div class="settings-card">
  <h2 class="settings-card__title">
    <i class="bi bi-person me-2"></i>Benutzer
  </h2>
  <div class="settings-list">
    <div class="settings-row">
      <span class="settings-row__label">E-Mail</span>
      <span class="settings-row__value">{{ userService.user.email }}</span>
    </div>
    <div class="settings-row settings-row--select">
      <label class="settings-row__label" for="account-list">Hauptkonto</label>
      <form [formGroup]="settingsUserFormGroup" class="w-100">
        <select class="settings-select" id="account-list"
          aria-label="Hauptkonto auswählen" formControlName="mainAccount">
          @for (account of accounts(); track $index) {
            <option value="{{ account.id }}">{{ account.name }}</option>
          }
        </select>
      </form>
    </div>
  </div>
</div>

<button type="button" class="logout-btn mt-3" (click)="onButtonLogout()">
  <i class="bi bi-box-arrow-right me-2"></i>Abmelden
</button>
