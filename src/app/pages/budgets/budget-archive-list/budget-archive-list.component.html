<!-- Modal edit Budget -->
<ng-template #editBudgetModal let-modal>
  <app-view-budget-content
    [budget]="clickedBudget"
    (onClose)="onCloseEditBudgetModal()">
  </app-view-budget-content>
</ng-template>

<div class="archive-page">
  @if (noTimeLimitBudgets.length > 0) {
    <div class="budget-cards">
      @for (budget of noTimeLimitBudgets; track budget.id) {
        <div class="budget-card" (click)="onCardClick(budget)">
          <app-budget-list-entry [budget]="budget" class="w-100"></app-budget-list-entry>
        </div>
      }
    </div>
  }
  @for (monthBudget of monthBudgets; track monthBudget.name) {
    <section>
      <h2 class="section-label">{{ monthBudget.name }}</h2>
      <div class="budget-cards">
        @for (budget of monthBudget.budgets; track budget.id) {
          <div class="budget-card" (click)="onCardClick(budget)">
            <app-budget-list-entry [budget]="budget" class="w-100"></app-budget-list-entry>
          </div>
        }
      </div>
    </section>
  }
</div>
