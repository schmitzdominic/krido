<!-- Modal edit Budget -->
<ng-template #editBudgetModal let-modal>
  <app-view-budget-content
    [budget]="clickedBudget"
    (onClose)="onCloseEditBudgetModal()">
  </app-view-budget-content>
</ng-template>
<!-- List of Budgets -->
<div class="container-fluid">
  <div class="row">
    <table class="table">
      <tbody>
        @for (budget of noTimeLimitBudgets; track budget.id) {
          <div class="card p-1 m-2" (click)="onCardClick(budget)">
            <div class="card-body">
              <app-budget-list-entry
                [budget]="budget">
              </app-budget-list-entry>
            </div>
          </div>
        }
      </tbody>
    </table>
  </div>
  <div class="row">
    <table class="table">
      <tbody>
        @for (monthBudget of monthBudgets; track monthBudget.name) {
          <div>
            <h1>{{ monthBudget.name }}</h1>
            @for (budget of monthBudget.budgets; track budget.id) {
              <div class="card p-1 m-2" (click)="onCardClick(budget)">
                <div class="card-body">
                  <app-budget-list-entry
                    [budget]="budget">
                  </app-budget-list-entry>
                </div>
              </div>
            }
          </div>
        }
      </tbody>
    </table>
  </div>
</div>
