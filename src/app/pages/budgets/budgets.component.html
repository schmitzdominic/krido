<div class="page-tabs">
  <button class="page-tab" [class.page-tab--active]="active === 'budgets'" (click)="active = 'budgets'">Aktiv</button>
  <button class="page-tab" [class.page-tab--active]="active === 'cycles'" (click)="active = 'cycles'">Zyklen</button>
  @if (isArchiveShown) {
    <button class="page-tab" [class.page-tab--active]="active === 'archive'" (click)="active = 'archive'">Archiv</button>
  }
</div>

@if (active === 'budgets') {
  <app-budget-list></app-budget-list>
} @else if (active === 'cycles') {
  <app-cycle-list></app-cycle-list>
} @else if (active === 'archive') {
  <app-budget-archive-list></app-budget-archive-list>
}
