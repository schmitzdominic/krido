<div class="modal-body sheet-body">
  <div class="sheet-header">
    <span class="sheet-header__title">{{ title }}</span>
  </div>

  <form [formGroup]="addCycleFormGroup" novalidate>

    <!-- Name -->
    <div class="form-field mb-3">
      <label class="form-field__label">Name</label>
      <input formControlName="name" type="text" class="form-field__input"
        placeholder="z. B. Lebensmittel" autocomplete="off" id="add-cycle-name">
    </div>

    <!-- Typ -->
    <div class="form-field mb-3">
      <label class="form-field__label">Typ</label>
      <div class="info-badge"><i class="bi bi-arrow-repeat me-2"></i>Monatlich</div>
    </div>

    <!-- Initiales Limit -->
    <div class="toggle-row mb-3">
      <label class="toggle-row__label" for="add-cycle-initial-limit">Initiales Limit setzen</label>
      <input formControlName="initialLimit" class="toggle-row__check" type="checkbox"
        id="add-cycle-initial-limit">
    </div>

    @if (isLimitVisible) {
      <div class="form-field mb-3">
        <label class="form-field__label">Limit</label>
        <div class="form-field__amount-wrap">
          <input currencyMask class="form-field__input form-field__input--amount"
            formControlName="limit"
            [options]="{ prefix: '', thousands: '.', decimal: ',' }"
            inputmode="decimal" placeholder="0,00" id="add-cycle-limit">
          <span class="form-field__currency">€</span>
        </div>
      </div>
    }

    <!-- Übertrag -->
    <div class="toggle-row mb-3">
      <label class="toggle-row__label" for="add-cycle-transfer">Übertrag (REST vom Vormonat)</label>
      <input formControlName="transfer" class="toggle-row__check" type="checkbox"
        id="add-cycle-transfer">
    </div>

    @if (isCreateNowVisible) {
      <div class="toggle-row mb-3">
        <label class="toggle-row__label" for="add-cycle-create-now">Budget für diesen Monat erstellen</label>
        <input formControlName="createNow" class="toggle-row__check" type="checkbox"
          id="add-cycle-create-now">
      </div>
    }

  </form>

  @if (cycle && budgets.length === 0) {
    <button type="button" class="btn-sheet btn-sheet--danger mt-2" (click)="onDelete()">
      <i class="bi bi-trash me-1"></i>Löschen
    </button>
  }
</div>

<div class="sheet-footer">
  <button type="button" class="btn-sheet btn-sheet--ghost" (click)="onCancel()">Abbrechen</button>
  <button type="button" class="btn-sheet btn-sheet--primary"
    [disabled]="isNameInvalid || isLimitInvalid"
    (click)="onSubmit()">{{ submitButtonText }}</button>
</div>
