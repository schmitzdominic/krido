<div class="modal-body sheet-body">
  <div class="budget-edit-title">{{ title }}</div>

  <form [formGroup]="addBudgetFormGroup" (ngSubmit)="onSubmit()" novalidate>

    <!-- Name -->
    <div class="form-field mb-3">
      <label class="form-field__label">Name</label>
      <input formControlName="name" type="text" class="form-field__input" placeholder="z. B. Lebensmittel" autocomplete="off">
    </div>

    <!-- Limit -->
    <div class="form-field mb-3">
      <label class="form-field__label">Limit</label>
      <div class="form-field__amount-wrap">
        <input
          currencyMask
          class="form-field__input form-field__input--amount"
          formControlName="limit"
          [options]="{ prefix: '', thousands: '.', decimal: ',' }"
          inputmode="decimal"
          placeholder="0,00">
        <span class="form-field__currency">€</span>
      </div>
    </div>

  </form>

  <!-- Archive / Delete actions -->
  @if (budget) {
    <div class="action-row">
      @if (!budget.isArchived) {
        <button type="button" class="btn-action btn-action--secondary" (click)="onArchive()">Archivieren</button>
      }
      @if (budget.isArchived) {
        <button type="button" class="btn-action btn-action--success" (click)="onDeArchive()">Aktivieren</button>
      }
      @if (isDeleteAvailable) {
        <button type="button" class="btn-action btn-action--danger" (click)="onDelete()">
          <i class="bi bi-trash"></i>
        </button>
      }
    </div>
  }

</div>

<div class="sheet-footer">
  <button type="button" class="btn-sheet btn-sheet--ghost" (click)="onCancel()">Abbrechen</button>
  <button
    type="button"
    class="btn-sheet btn-sheet--primary"
    [disabled]="addBudgetFormGroup.invalid || !isEdited"
    (click)="onSubmit()">{{ submitButtonText }}</button>
</div>
