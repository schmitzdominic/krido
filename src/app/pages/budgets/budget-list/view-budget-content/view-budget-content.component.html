<!-- Edit -->
@if (!isContentReadOnly) {
  <app-add-or-edit-budget-content
    [budget]="budget"
    (onClose)="onCancel()">
  </app-add-or-edit-budget-content>
}

<!-- View -->
@if (isContentReadOnly) {
  <div class="modal-body sheet-body">
    <div class="view-header">
      <div class="budget-title">{{ budget?.name }}</div>
      @if (isEditButtonShown) {
        <button type="button" class="edit-btn" (click)="onEdit()"><i class="bi bi-pencil"></i></button>
      }
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Höhe</span>
        <span class="stat-value">{{ priceService.convertNumberToEuro(budget?.limit) }}</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item stat-item--right">
        <span class="stat-label">Rest</span>
        <span class="stat-value" [ngClass]="getRestClass()">{{ getRestBudget() }}</span>
      </div>
    </div>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <ngb-progressbar
        [value]="usedLimit"
        [max]="budget?.limit!"
        type="{{ progressBarService.getProgressBarType(usedLimit, budget?.limit!) }}"
      ></ngb-progressbar>
      <div class="progress-label">{{ getProgressBarText() }}</div>
    </div>

    <!-- Entries -->
    @if (entries.length > 0) {
      <div class="entries-header">Einträge</div>
    }
    <div class="entries-card-group">
      @for (entry of entries; track entry.id) {
        <div class="entry-row" (click)="onEntryClick(entry)">
          <app-entry-list-entry
            [withMonth]="true"
            [entry]="entry">
          </app-entry-list-entry>
        </div>
      }
    </div>
  </div>

  <div class="sheet-footer">
    <button type="button" class="btn-sheet btn-sheet--ghost" (click)="onCancel()">Schließen</button>
  </div>
}
