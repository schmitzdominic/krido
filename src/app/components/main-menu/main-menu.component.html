<nav class="navbar sticky-top navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <div class="me-2">
      <button type="button" class="btn top-50" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
    </div>
    <a class="navbar-brand ps-2" [hidden]="homeUIService.isSearchActive()">{{ menuTitleService.title() }}</a>
    @if (homeUIService.isSearchActive()) {
      <div class="flex-grow-1 mx-2">
        <input type="text" class="form-control form-control-sm search-input"
               placeholder="Suchen..."
               autofocus
               [value]="homeUIService.searchQuery()"
               (input)="homeUIService.searchQuery.set($any($event.target).value)">
      </div>
    }
    @if (isOnHome()) {
      <div class="d-flex align-items-center gap-1" [class.ms-auto]="!homeUIService.isSearchActive()">
        <button type="button" class="btn btn-icon-nav" (click)="homeUIService.toggleSearch()">
          <i class="bi" [ngClass]="homeUIService.isSearchActive() ? 'bi-x-lg' : 'bi-search'"></i>
        </button>
        @if (!homeUIService.isSearchActive() && !homeUIService.isAccountsExpanded()) {
          <div ngbDropdown placement="bottom-end" container="body">
            <button type="button" class="btn btn-icon-nav no-caret" ngbDropdownToggle>
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="homeUIService.requestShowAccounts()">
                <i class="bi bi-eye pe-2"></i>Konten einblenden
              </button>
            </div>
          </div>
        }
      </div>
    }
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul ngbNav [activeId]="menuTitleService.activeId()" (activeIdChange)="menuTitleService.activeId.set($event)" class="navbar-nav me-auto mb-2 mt-4 mb-lg-0">
        <li [ngbNavItem]="1">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToHome()"><i class="bi bi-house pe-2"></i> Home</button>
        </li>
        <li [ngbNavItem]="2">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToInvoice()"><i class="bi bi-cash-coin pe-2"></i> Abrechnung</button>
        </li>
        <li [ngbNavItem]="3">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToHistory()"><i class="bi bi-clock-history pe-2"></i> Historie</button>
        </li>
        <li [ngbNavItem]="4">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToRegularly()"><i class="bi bi-arrow-repeat pe-2"></i> Regelmäßig</button>
        </li>
        <li [ngbNavItem]="5">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToAccounts()"><i class="bi bi-bank pe-2"></i> Konten</button>
        </li>
        <li [ngbNavItem]="6">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToBudgets()"><i class="bi bi-bag pe-2"></i> Budgets</button>
        </li>
        <li [ngbNavItem]="7">
          <button
            ngbNavLink
            data-bs-toggle="collapse"
            data-bs-target=".navbar-collapse.show"
            (click)="navigateToSettings()"><i class="bi bi-gear pe-2"></i> Einstellungen</button>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="page-content">
  <router-outlet></router-outlet>
</div>
