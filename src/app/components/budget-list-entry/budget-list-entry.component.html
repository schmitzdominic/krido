<div class="d-flex justify-content-between mb-2">
  <span class="name"> {{budget.name}} </span>
  <span class="limit" [ngClass]="{ 'text-danger' : budget.limit! < 0 }">
    {{ budget.limit ? priceService.convertNumberToEuro(budget.limit!) : 'Bitte Limit setzen' }}
  </span>
</div>
@if (budget.limit! >= 0) {
  <ngb-progressbar
    [value]="usedLimit"
    [max]="budget.limit!"
    type="{{progressBarService.getProgressBarType(usedLimit, budget.limit!)}}"
  ></ngb-progressbar>
  <div class="rest-row">
    @if (getProgressBarText()) {
      <span class="progress-label">{{ getProgressBarText() }}</span>
    } @else {
      <span></span>
    }
    <span class="rest-label">Rest: {{ priceService.convertNumberToEuro(budget.limit! - usedLimit) }}</span>
  </div>
}
